<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Server Mode</title>
  <!-- cyberpunk server rack: neon outline, glitch shift, moving scan line, blinking LEDs (SMIL) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140A2E"/>
      <stop offset="1" stop-color="#05040F"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1640"/>
      <stop offset="1" stop-color="#0C0A22"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="2" y="2" width="96" height="96" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="2" y="2" width="96" height="96" fill="url(#bg)"/>
    <!-- floor grid -->
    <g stroke="#FF2BD6" stroke-width="0.6" opacity="0.35">
      <path d="M2 80 H98 M2 86 H98 M2 93 H98"/>
      <path d="M50 76 L50 98 M38 76 L26 98 M62 76 L74 98 M26 76 L2 96 M74 76 L98 96"/>
    </g>

    <!-- glitch ghost of the case (magenta, shifted left) -->
    <path d="M30 12 H76 L80 16 V74 L76 78 H24 L20 74 V22 Z" fill="none" stroke="#FF2BD6" stroke-width="2" opacity="0.7"
      transform="translate(-3 2)">
      <animateTransform attributeName="transform" type="translate"
        values="-3 2;-3 2;-6 3;1 -1;-3 2" keyTimes="0;0.86;0.9;0.94;1" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- case with a cut corner -->
    <path d="M30 12 H76 L80 16 V74 L76 78 H24 L20 74 V22 Z" fill="url(#case)" stroke="#00F0FF" stroke-width="2.2" filter="url(#glow)"/>
    <path d="M22 21 L29 14" stroke="#00F0FF" stroke-width="1.2" opacity="0.7"/>

    <!-- three rack units -->
    <g fill="#07061A" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6">
      <rect x="26" y="22" width="48" height="14" rx="1.5"/>
      <rect x="26" y="40" width="48" height="14" rx="1.5"/>
      <rect x="26" y="58" width="48" height="14" rx="1.5"/>
    </g>
    <!-- vents -->
    <g stroke="#3A3A8C" stroke-width="1.6" stroke-linecap="round">
      <path d="M30 29 H50 M30 47 H50 M30 65 H50"/>
    </g>
    <g stroke="#00F0FF" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
      <path d="M30 29 H38 M30 47 H44 M30 65 H34"/>
    </g>

    <!-- LEDs -->
    <g filter="url(#glow)">
      <circle cx="62" cy="29" r="2.4" fill="#FF2BD6">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="69" cy="29" r="2.4" fill="#00F0FF"/>
      <circle cx="62" cy="47" r="2.4" fill="#00F0FF"/>
      <circle cx="69" cy="47" r="2.4" fill="#F5FF3B">
        <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.5;0.6;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="62" cy="65" r="2.4" fill="#FF2BD6">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="69" cy="65" r="2.4" fill="#00F0FF"/>
    </g>

    <!-- scan line moving down the case -->
    <rect x="21" y="14" width="58" height="2" fill="#00F0FF" opacity="0.35">
      <animate attributeName="y" values="14;74;14" dur="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- glitch bars -->
    <rect x="58" y="36" width="26" height="2.4" fill="#FF2BD6" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.86;0.9;0.94;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="55" width="20" height="1.6" fill="#00F0FF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.9;0.93;1" dur="3s" repeatCount="indefinite"/>
    </rect>

  </g>
  <!-- tile frame -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="14" fill="none" stroke="#FF2BD6" stroke-width="1" opacity="0.6"/>
</svg>
