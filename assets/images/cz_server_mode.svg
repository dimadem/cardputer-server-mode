<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Server Mode</title>
  <!-- neon-noir style: a black ink-blob server on acid yellow, with chromatic glitch,
       blinking LEDs and a glitch slice (SMIL) -->
  <defs>
    <clipPath id="tile"><path d="M2 2 H84 L98 16 V98 H16 L2 84 Z"/></clipPath>
    <path id="blob" d="M28 22 C33 11 65 8 74 18 C83 27 79 40 78 50 C77 60 82 66 78 73 C75 79 70 77 69 83 C68 90 62 90 61 84 C60 78 56 78 54 82 C52 89 45 92 43 86 C41 80 37 80 33 82 C27 85 21 78 24 70 C26 62 20 56 21 46 C22 36 22 30 28 22 Z"/>
    <clipPath id="blobClip"><use href="#blob"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="#F3E600"/>
    <!-- hazard stripes and a scan pattern -->
    <g stroke="#0A0A0A" stroke-width="3">
      <path d="M-4 98 L8 86 M2 104 L14 92 M8 110 L20 98"/>
    </g>
    <g fill="#0A0A0A" opacity="0.12">
      <rect x="0" y="10" width="100" height="1"/><rect x="0" y="30" width="100" height="1"/>
      <rect x="0" y="50" width="100" height="1"/><rect x="0" y="70" width="100" height="1"/>
    </g>
    <!-- tech label and barcode -->
    <text x="7" y="11" font-family="DejaVu Sans Mono, monospace" font-size="6.5" font-weight="bold" fill="#0A0A0A">SRV//0x7</text>
    <g fill="#0A0A0A">
      <rect x="86" y="40" width="7" height="1.2"/><rect x="86" y="42.5" width="7" height="0.6"/>
      <rect x="86" y="44" width="7" height="1.8"/><rect x="86" y="47" width="7" height="0.6"/>
      <rect x="86" y="48.5" width="7" height="1.2"/><rect x="86" y="51" width="7" height="2"/>
    </g>

    <!-- chromatic aberration copies of the blob -->
    <use href="#blob" fill="#FF003C" transform="translate(-3 1)">
      <animateTransform attributeName="transform" type="translate"
        values="-3 1;-3 1;-7 1;-2 0;-3 1" keyTimes="0;0.8;0.84;0.9;1" dur="2.5s" repeatCount="indefinite"/>
    </use>
    <use href="#blob" fill="#00E5FF" transform="translate(3 -1)">
      <animateTransform attributeName="transform" type="translate"
        values="3 -1;3 -1;6 -2;2 0;3 -1" keyTimes="0;0.8;0.84;0.9;1" dur="2.5s" repeatCount="indefinite"/>
    </use>
    <!-- the blob -->
    <use href="#blob" fill="#0A0A0A"/>
    <!-- splashes -->
    <circle cx="16" cy="60" r="2.4" fill="#0A0A0A"/>
    <circle cx="84" cy="28" r="1.8" fill="#0A0A0A"/>
    <circle cx="86" cy="80" r="2.6" fill="#0A0A0A"/>
    <circle cx="51" cy="94" r="1.6" fill="#0A0A0A"/>

    <!-- rack units inside the blob -->
    <g clip-path="url(#blobClip)">
      <g fill="none" stroke="#00E5FF" stroke-width="1.4">
        <path d="M30 28 H70 V39 H30 Z M30 44 H70 V55 H30 Z M30 60 H70 V71 H30 Z"/>
      </g>
      <g stroke="#F3E600" stroke-width="1.8">
        <path d="M34 33.5 H48 M34 49.5 H52 M34 65.5 H42"/>
      </g>
      <circle cx="60" cy="33.5" r="2.2" fill="#FF003C">
        <animate attributeName="opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="66" cy="33.5" r="2.2" fill="#00E5FF"/>
      <circle cx="60" cy="49.5" r="2.2" fill="#00E5FF"/>
      <circle cx="66" cy="49.5" r="2.2" fill="#FF003C"/>
      <circle cx="60" cy="65.5" r="2.2" fill="#F3E600">
        <animate attributeName="opacity" values="1;1;0.1;1" keyTimes="0;0.5;0.6;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="66" cy="65.5" r="2.2" fill="#00E5FF"/>
    </g>

    <!-- glitch slice: a strip of the image jumps sideways -->
    <g opacity="0">
      <rect x="18" y="45" width="64" height="4" fill="#00E5FF" transform="translate(6 0)"/>
      <rect x="10" y="47" width="22" height="1.5" fill="#FF003C" transform="translate(6 0)"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.81;0.88;0.89;1" dur="2.5s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- cut-corner frame -->
  <path d="M2.5 2.5 H84 L97.5 16 V97.5 H16 L2.5 84 Z" fill="none" stroke="#0A0A0A" stroke-width="2"/>
</svg>
