<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Server Mode</title>
  <!-- cute (anime style) server rack; the LEDs blink in viewers that play SMIL animation -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F7BFF"/>
      <stop offset="1" stop-color="#6A4DF0"/>
    </linearGradient>
  </defs>
  <!-- feet -->
  <rect x="26" y="88" width="12" height="6" rx="2" fill="#3A2A9E"/>
  <rect x="62" y="88" width="12" height="6" rx="2" fill="#3A2A9E"/>
  <!-- case -->
  <rect x="16" y="6" width="68" height="84" rx="12" fill="url(#body)" stroke="#3A2A9E" stroke-width="3"/>
  <!-- face panel -->
  <rect x="23" y="13" width="54" height="34" rx="8" fill="#231C4A"/>
  <!-- eyes -->
  <g transform-origin="50 29">
    <ellipse cx="38" cy="29" rx="6" ry="7.5" fill="#FFFFFF"/>
    <ellipse cx="62" cy="29" rx="6" ry="7.5" fill="#FFFFFF"/>
    <ellipse cx="38.6" cy="30.2" rx="4" ry="5.4" fill="#2FD6C5"/>
    <ellipse cx="61.4" cy="30.2" rx="4" ry="5.4" fill="#2FD6C5"/>
    <ellipse cx="38.6" cy="31" rx="2.2" ry="3.2" fill="#0F1030"/>
    <ellipse cx="61.4" cy="31" rx="2.2" ry="3.2" fill="#0F1030"/>
    <circle cx="36.6" cy="27.3" r="1.8" fill="#FFFFFF"/>
    <circle cx="59.4" cy="27.3" r="1.8" fill="#FFFFFF"/>
    <circle cx="40.2" cy="33.2" r="0.9" fill="#FFFFFF"/>
    <circle cx="63" cy="33.2" r="0.9" fill="#FFFFFF"/>
    <!-- blink: the eyes close for a moment every 4 s -->
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
  </g>
  <!-- blush and smile -->
  <ellipse cx="29.5" cy="38.5" rx="3.6" ry="2" fill="#FF7AA8" opacity="0.85"/>
  <ellipse cx="70.5" cy="38.5" rx="3.6" ry="2" fill="#FF7AA8" opacity="0.85"/>
  <path d="M46 38.5 Q50 42.5 54 38.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <!-- drive bays -->
  <rect x="23" y="53" width="54" height="14" rx="4" fill="#231C4A"/>
  <rect x="23" y="70" width="54" height="14" rx="4" fill="#231C4A"/>
  <rect x="29" y="58.5" width="22" height="3" rx="1.5" fill="#5A4BB0"/>
  <rect x="29" y="75.5" width="22" height="3" rx="1.5" fill="#5A4BB0"/>
  <!-- LEDs -->
  <circle cx="62" cy="60" r="3" fill="#3DFF8F">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70.5" cy="60" r="3" fill="#FFC83D"/>
  <circle cx="62" cy="77" r="3" fill="#3DFF8F"/>
  <circle cx="70.5" cy="77" r="3" fill="#3DFF8F">
    <animate attributeName="opacity" values="1;0.25;1" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <!-- sparkle -->
  <path d="M88 10 L90 15 L95 17 L90 19 L88 24 L86 19 L81 17 L86 15 Z" fill="#FFE066"/>
</svg>
